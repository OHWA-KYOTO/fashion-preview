<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FashionPrototype — Preview Fixed</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f0f4;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:18px}.wrap{width:400px;max-width:100%}.note{text-align:center;color:#777;font-size:12px;margin:0 0 12px;line-height:1.5}.phone{height:min(790px,88vh);min-height:540px;border:7px solid #26242b;border-radius:44px;background:white;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 48px #0002}.status{height:39px;flex-shrink:0;display:flex;justify-content:space-between;padding:12px 25px;font-size:13px;font-weight:700}.screen{display:flex;flex-direction:column;flex:1;min-height:0}.top{display:flex;justify-content:space-between;align-items:center;min-height:62px;padding:12px 18px;gap:12px}.heading{font-size:27px;letter-spacing:-1px;font-weight:700}.muted{color:#888;font-size:12px}.iconbutton{border:0;background:none;font-size:23px;cursor:pointer;color:#51495a;min-width:34px;min-height:34px}.photo-wrap{display:flex;flex:1;min-height:0;margin:0 12px;touch-action:pan-y;cursor:grab;user-select:none}.photo{border-radius:17px;overflow:hidden;display:flex;flex:1;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative;color:#36303c}.photo:before{content:'';position:absolute;width:75%;aspect-ratio:1;top:-15%;right:-28%;border-radius:50%;background:#ffffff40}.motif{font-size:78px;opacity:.65}.eyebrow{font-size:10px;letter-spacing:3px;margin:15px 0 9px}.phototext{font-size:24px;font-weight:700}.hint{font-size:11px;text-align:center;color:#8d8992;padding:18px 8px;line-height:1.5}.tabs{height:72px;border-top:1px solid #f0edf2;display:grid;grid-template-columns:repeat(3,1fr);flex-shrink:0;padding-bottom:8px}.tab{border:0;background:transparent;color:#85808c;font-size:11px;cursor:pointer}.tab.active{color:#755e99;font-weight:700}.tabicon{font-size:24px;display:block;line-height:30px}.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);align-content:start;gap:3px}.tile{aspect-ratio:3/4;display:grid;place-items:center;font-size:32px;cursor:pointer;position:relative}.tile.selected:after{content:'✓';position:absolute;right:6px;top:5px;background:#755e99;color:white;border-radius:100px;width:20px;height:20px;text-align:center;font-size:14px}.subrow{display:flex;align-items:center;justify-content:space-between;padding:5px 18px 15px;color:#777;font-size:12px}.link{background:transparent;border:0;color:#755e99;font:inherit;cursor:pointer}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8a8590;padding:25px;gap:12px}.primary{background:#d9c9ee;color:#2b2435;border:0;border-radius:13px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;width:100%}.profile{display:flex;align-items:center;gap:12px;padding:10px 18px 25px}.avatar{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:#e5d9f1;font-size:27px}.section{padding:26px 18px 13px;font-weight:700}.toast{position:absolute;top:45px;left:50%;transform:translateX(-50%);background:#eee7f8;border-radius:25px;padding:10px 15px;white-space:nowrap;font-size:12px;box-shadow:0 5px 18px #0002;z-index:5}.phone{position:relative}.footer{text-align:center;font-size:11px;color:#888;margin:9px 0 0}button:focus-visible,.tile:focus-visible{outline:2px solid #755e99;outline-offset:-2px}@media(max-height:680px){body{padding:4px}.phone{height:90vh}.note{margin-bottom:4px}}
</style></head><body><main class="wrap"><p class="note">v3.8 ブラウザ操作プレビュー（SwiftUI実機ビルドではありません）<br>写真はデモ用プレースホルダーです</p><div class="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div><section id="screen" class="screen"></section><nav id="tabs" class="tabs"></nav><div id="toast" class="toast" hidden></div></div><p class="footer">マウスのドラッグ / タッチ操作で左右にフリックできます</p></main><script>
'use strict';
const names=['knit & denim','silver sneakers','city casual','mini shoulder bag','weekend layers','silver accents','oversized shirt','tone on tone','denim mood','soft cardigan','canvas tote','street snap','my first outfit','my second outfit','my accessories'];
const colors=[['#c0bfd9','#d9e3ed'],['#a6bac7','#e8e3db'],['#c7baa6','#f7e0c9'],['#baaabb','#f0d9de'],['#b9c7a3','#dee8d4'],['#b5bad0','#e8e3fa'],['#a8c4d9','#daeaf0'],['#d1beba','#f7ede0'],['#8da6cc','#d4deee'],['#d9b8c2','#fae6e9'],['#baab8c','#eee0c7'],['#abb0c5','#dde0eb'],['#c9b0d4','#f2dbed'],['#ccbc9c','#f2ead1'],['#a3c2ba','#dbece3']];
let tab=0,cursor=0,picks=[2,4,6,8,10,12],detail=null,guest=true,selection=false,selected=new Set(),reversed=false;
const screen=document.getElementById('screen'),nav=document.getElementById('tabs');
function notice(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,1700)}
function bg(id){const c=colors[id-1];return 'linear-gradient(135deg,'+c[0]+','+c[1]+')'}
function photo(id){return '<div class="photo" style="background:'+bg(id)+'"><div style="position:relative"><div class="motif">'+(['♧','♙','◈'][id%3])+'</div><div class="eyebrow">DAILY LOOK / '+String(id).padStart(2,'0')+'</div><div class="phototext">'+names[id-1]+'</div></div></div>'}
function tile(id){return '<div class="tile'+(selected.has(id)?' selected':'')+'" role="button" tabindex="0" data-pick="'+id+'" style="background:'+bg(id)+'">'+(['♧','♙','◈'][id%3])+'</div>'}
function ordered(){return reversed?[...picks].reverse():[...picks]}
function switchTab(id){tab=id;detail=null;selection=false;selected.clear();render()}
function discoverSwipe(save){if(cursor>=names.length)return;const id=cursor+1;if(save&&!picks.includes(id))picks.push(id);cursor++;notice(save?'My Picksに保存しました':'スキップしました');render()}
function nextPick(){const arr=ordered();const i=arr.indexOf(detail);if(i>=arr.length-1){notice('最後の写真です');return}detail=arr[i+1];render()}
function removePick(){const arr=ordered(),i=arr.indexOf(detail);picks=picks.filter(id=>id!==detail);detail=arr[i+1]&&picks.includes(arr[i+1])?arr[i+1]:(arr[i-1]&&picks.includes(arr[i-1])?arr[i-1]:null);render();notice('保存を解除しました')}
function attachSwipe(onLeft,onRight){const el=screen.querySelector('[data-swipe]');if(!el)return;let down=null;el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};if(el.setPointerCapture)el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)(dx<0?onLeft:onRight)()})}
function render(){nav.innerHTML=['Discover','My Picks','My Page'].map((name,i)=>'<button class="tab '+(tab===i?'active':'')+'" data-tab="'+i+'"><span class="tabicon">'+['✧','♡','♙'][i]+'</span>'+name+'</button>').join('');
if(tab===0){screen.innerHTML='<header class="top"><div class="heading">Discover</div><button class="iconbutton" id="more">⋯</button></header>'+(cursor<names.length?'<div class="photo-wrap" data-swipe>'+photo(cursor+1)+'</div><div class="hint">← スキップ &nbsp;&nbsp; / &nbsp;&nbsp; 保存 →</div>':'<div class="center">新しいコーデはありません<button class="link" id="restart">最初から見る</button></div>');attachSwipe(()=>discoverSwipe(false),()=>discoverSwipe(true));if(document.getElementById('restart'))document.getElementById('restart').onclick=()=>{cursor=0;render()};document.getElementById('more').onclick=()=>notice('通報・ブロックは未実装です');return}
if(tab===1){if(detail!==null){screen.innerHTML='<header class="top"><button class="link" id="back">‹ 戻る</button><b>My Picks</b><button class="iconbutton" id="remove" title="保存解除">⋯</button></header><div class="photo-wrap" data-swipe>'+photo(detail)+'</div><div class="hint">← 次の写真 &nbsp;&nbsp; / &nbsp;&nbsp; iPhone写真アプリに保存 →<br>※ブラウザ版では写真アプリへの保存はできません</div>';document.getElementById('back').onclick=()=>{detail=null;render()};document.getElementById('remove').onclick=removePick;attachSwipe(nextPick,()=>notice('写真アプリへの保存はネイティブ版で実装予定'));return}
const arr=ordered();screen.innerHTML='<header class="top"><div><div class="heading">My Picks</div><div class="muted">お気に入りのコーデ</div></div><button class="link" id="select">'+(selection?'完了':'選択')+'</button></header><div class="subrow"><button class="link" id="sort">↕ '+(reversed?'保存した順':'おすすめ順（デモ）')+'</button><span>'+picks.length+' picks</span></div>'+(arr.length?'<div class="grid">'+arr.map(tile).join('')+'</div>':'<div class="center">まだお気に入りがありません</div>')+(selection&&selected.size?'<button class="primary" id="removeSelected">'+selected.size+'件を保存解除</button>':'');document.getElementById('sort').onclick=()=>{reversed=!reversed;render()};document.getElementById('select').onclick=()=>{selection=!selection;selected.clear();render()};screen.querySelectorAll('[data-pick]').forEach(el=>{const action=()=>{const id=Number(el.dataset.pick);if(selection){selected.has(id)?selected.delete(id):selected.add(id)}else detail=id;render()};el.onclick=action;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}}});if(document.getElementById('removeSelected'))document.getElementById('removeSelected').onclick=()=>{picks=picks.filter(id=>!selected.has(id));selected.clear();selection=false;render()};return}
screen.innerHTML='<header class="top"><div class="heading">My Page</div><button class="iconbutton" id="settings">⚙</button></header><div class="profile"><div class="avatar">♙</div><div><b>'+(guest?'Guest':'Demo User')+'</b><div class="muted">'+(guest?'投稿にはアカウント登録が必要です':'@demo_user')+'</div></div></div><div style="padding:0 18px"><button class="primary" id="upload">＋ 写真を投稿</button></div><div class="section">自分の投稿 <span class="muted" style="float:right">'+(guest?'0':'3')+' photos</span></div>'+(guest?'<div class="center">投稿はまだありません<br><span class="muted">DiscoverとMy Picksはゲストでも利用できます</span></div>':'<div class="grid" style="flex:none">'+[13,14,15].map(tile).join('')+'</div><div class="hint"><button class="link" id="guest">ゲスト状態に戻す</button></div>');document.getElementById('settings').onclick=()=>notice('設定画面は未実装です');document.getElementById('upload').onclick=()=>{if(guest){guest=false;render();notice('デモ用のログイン状態に切り替えました')}else notice('投稿APIは未接続です')};if(document.getElementById('guest'))document.getElementById('guest').onclick=()=>{guest=true;render()};}
nav.addEventListener('click',e=>{const btn=e.target.closest('[data-tab]');if(btn)switchTab(Number(btn.dataset.tab))});render();
</script></body></html>
